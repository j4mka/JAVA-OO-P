{t:"Grundlagen der OOP",i:"Objekte statt Befehlsketten: Abstraktion (nur Wesentliches), Kapselung (Daten privat), Modularität (kleine Klassen), Wiederverwendung (Vererbung).",
T:[
{h:"Klassen, Objekte, Konstruktor, Geltungsbereiche",x:"Die <b>Klasse</b> ist der Bauplan, das <b>Objekt</b> eine Instanz. <b>Attribute</b> speichern Zustand, <b>Methoden</b> das Verhalten. Der <b>Konstruktor</b> läuft bei <code>new</code>. Einen Destruktor gibt es nicht, der Garbage Collector räumt auf. <b>Klassenvariable</b> (<code>static</code>): einmal pro Klasse. <b>Instanzvariable</b>: pro Objekt. <b>Lokale Variable</b>: nur im Block.",
c:`public class Konto {
    static int anzahl = 0;        // Klassenvariable
    private double stand;         // Instanzvariable
    Konto(double start) { stand = start; anzahl++; }
    void einzahlen(double b) {
        if (b <= 0) throw new IllegalArgumentException("Betrag > 0");
        double neu = stand + b;   // lokale Variable
        stand = neu;
    }
    double getStand() { return stand; }
    public static void main(String[] a) {
        Konto k = new Konto(100);
        k.einzahlen(50);
        System.out.println(k.getStand() + " / Konten: " + anzahl);
    }
}`,o:"150.0 / Konten: 1"},
{h:"Vererbung, Polymorphie, Überschreiben",x:"<code>extends</code> bedeutet „ist ein“. Mit <code>@Override</code> ersetzt die Unterklasse eine Methode. Eine Variable der Oberklasse kann jede Unterklasse halten, aufgerufen wird die passende Methode (Polymorphie).",
c:`class Tier { String laut() { return "..."; } }
class Hund extends Tier { @Override String laut() { return "Wuff"; } }
class Katze extends Tier { @Override String laut() { return "Miau"; } }

Tier[] stall = { new Hund(), new Katze(), new Tier() };
for (Tier t : stall) System.out.println(t.laut());`,o:"Wuff\nMiau\n..."},
{h:"Exception Handling",x:"<b>Checked</b> (z. B. <code>IOException</code>): Compiler erzwingt <code>try/catch</code> oder <code>throws</code>. <b>Unchecked</b> (<code>RuntimeException</code>): meist Programmierfehler. <code>finally</code> läuft immer.",
c:`try {

{t:"Praxisprojekt: Mini-Bibliothek",i:"Alles zusammen: Entwurf mit UML, Klassen, ArrayList, Schleifen, Exceptions, Tests.",
T:[
{h:"Schritt 1 und 2: Entwurf und Code",x:"Entwurf: <code>Bibliothek ◆── Buch</code>, Enum <code>Status</code>, Methoden <code>hinzufuegen</code>, <code>suchen</code>, <code>ausleihen</code>.",
c:`enum Status { VERFUEGBAR, AUSGELIEHEN }
class Buch {
    final String titel; Status status = Status.VERFUEGBAR;
    Buch(String t) { titel = t; }
}
class Bibliothek {
    private final ArrayList<Buch> buecher = new ArrayList<>();
    void hinzufuegen(Buch b) { buecher.add(b); }
    Buch suchen(String t) {
        for (Buch b : buecher) if (b.titel.equalsIgnoreCase(t)) return b;
        return null;
    }
    void ausleihen(String t) {
        Buch b = suchen(t);
        if (b == null) throw new IllegalArgumentException("Unbekannt: " + t);
        if (b.status == Status.AUSGELIEHEN) throw new IllegalStateException("Schon weg");
        b.status = Status.AUSGELIEHEN;
    }
}
// main
Bibliothek bib = new Bibliothek();
bib.hinzufuegen(new Buch("Faust"));
try { bib.ausleihen("Faust"); bib.ausleihen("Faust"); }
catch (IllegalStateException | IllegalArgumentException e) { System.out.println(e.getMessage()); }`,o:"Schon weg"},
{h:"Schritt 3: Testen, Debuggen, Dokumentieren",x:"<ul><li><b>Testen:</b> Normalfall, Randfall (leere Liste), Fehlerfall (unbekannter Titel). Später automatisch mit JUnit.</li><li><b>Debuggen:</b> Haltepunkt links neben die Zeile setzen, Debug starten, mit „Step Over“ Zeile für Zeile gehen.</li><li><b>Dokumentieren:</b> Javadoc (<code>/** ... @param ... @throws ... */</code>) über jede Methode.</li></ul><b>Erweiterung:</b> Klasse <code>Leser</code>, Rückgabe, Suche nach Autor, Konsolenmenü mit <code>Scanner</code>."}],

m.appendChild(qc);
var f=mk("div","fin"),pv=mk("button",null,"← Zurück"),db=mk("button","run",done[i]?"✓ Erledigt (zurücknehmen)":"Kapitel abschließen"),nx=mk("button",null,"Weiter →");
